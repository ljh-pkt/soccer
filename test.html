<!DOCTYPE html>
<html lang="en">
<head>	
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">	
    <title>test</title>
	<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
	<style>
		body > div {margin: 20px;}
		
		#list > div {display: flex;}
		#list > div > div {margin: 5px; cursor: pointer;}
		
		#detail {display: none;}
		#detail > div {margin: 20px;}
		
		h4 {margin-bottom: 5px;}
	</style>
	<script>
		/*
		  데이터 형식 : 날짜, {[항목:값, 이름:값, 금액:값],[항목:값, 이름:값, 금액:값]}
		*/
		var obj = {}; // json 파일 내용
		
		$(document).ready(function() {									
			document.getElementById("fileInput").addEventListener("change", function(event) { // 파일 읽기
				let file = event.target.files[0]; // 사용자가 선택한 파일 가져오기
				
				if (file) {
					let reader = new FileReader(); // FileReader 객체 생성
					
					reader.onload = function(e) {
						
						/* list */
						$("#list > div").after().not(':first').remove(); // 목록 초기화
						var html = "";
						var result = e.target.result; // 파일 내용 출력
						obj = JSON.parse(result);
						var keys = Object.keys(obj);
						$.each(keys, function(index, value) {
							var date = value;
							html += "<div><div onclick='fn_detail("+date+");'>"+date+"</div><button onclick='fn_delList("+date+");'>삭제</button></div>";
						})
						$("#list").append(html);
					};					
					
					reader.readAsText(file, "UTF-8"); // 파일을 UTF-8로 읽기
				}				
			})	

			$(document).on('click', '.del', function() { // 삭제
				var id = $(this).attr('id');				
			})
			
			$(document).on('keyup', '[name=cost]', function() { // input박스에 값 입력시				
				fn_sum();
			});
			
			$(document).on('change', '[name=item]', function() { // select 값 변경시			
				fn_sum();
			});
		})
		
		function fn_list() { // 목록
			$("#detail").hide();
			$("#file").show();
			$("#list").show();			
		}
		
		function fn_detail(date){ // 상세			
			$("#file").hide();
			$("#list").hide();
			$("#detail").show();
			
			//상세 초기화
			$("#area_cost > div").remove();
			$("#area_sum > div").remove();
			
			if(date == "" || date == undefined) {			
				date = fn_day();
				$("[name=datetime]").val(date);
			} else {
				var entries = obj[date];
				$("[name=datetime]").val(date);
				for(var i=0; i<entries.length; i++) {
					var entry = entries[i];
					var item = entry[0];							
					var name = entry[1];
					var cost = entry[2];							
					
					fn_add();
					
					$("[name=item]").eq(i).val(item);
					$("[name=name]").eq(i).val(name);
					$("[name=cost]").eq(i).val(cost);														
				}
				fn_sum();
			}
		}
		
		function fn_add() { // 추가
			var arr = ['aa', 'bb', 'cc'];
			var html = "";
			html += "<div>";
			html += "<select name='item'>";
			arr.forEach(function(value) {
				html += "<option value='"+value+"'>"+value+"</option>";
			})			
			html += "</select>";
			html += "<input type='text' name='name'><input type='text' name='cost'>";
			html += "<button onclick='fn_delDetail(this)'>삭제</button></div>";			
			$("#area_cost").append(html);
		}
		
		function fn_delList(date) { // 리스트 삭제
			if(!confirm("삭제 하시겠습니까?")) {
				return;
			}
			
			delete obj[date];
		
			var jsonStr = JSON.stringify(obj, null, 2);									
			
			var blob = new Blob([jsonStr], { type: 'application/json' });
			var url = URL.createObjectURL(blob);
			var a = document.createElement('a');
			a.href = url;
			a.download = "text.json";
			a.click();
			
			URL.revokeObjectURL(url);
		}
		
		function fn_delDetail(btn) { // 상세 삭제
			btn.parentElement.remove();
			fn_sum();
		}
		
		function fn_sum() { // 합계			
			var sum = {}; // item, cost
			
			$("[name=item]").each(function(idx) { // 합계
				var item = $(this).val();
				var name = $("[name=name]").eq(idx).val();
				var cost = $("[name=cost]").eq(idx).val();
				
				if([item] in sum) { // 값을 가지고 있으면					
					sum[item] += parseInt(cost);
				} else { // 값이 없으면					
					sum[item] = parseInt(cost);
				}								
			})
			
			var html = "";
			var keys = Object.keys(sum);
			for(var i=0; i<keys.length; i++) {
				var key = keys[i];								
				html += "<div>"+key+" : <input type='text' name='sum_"+key+"' value='"+sum[key]+"'></div>";				
			}			
			$("#area_sum").html(html);
		}
				
		function fn_save() { //저장
			if(!confirm("저장 하시겠습니까?")) {
				return;
			}
			
			var json = {};
			var datetime = $("#datetime").val();			
			obj[datetime] = []; //날짜 입력									
			
			for(var i=0; i<$("[name=item]").length; i++) {				
				var item = $("[name=item]").eq(i).val();
				var name = $("[name=name]").eq(i).val();
				var cost = $("[name=cost]").eq(i).val();
				var arr = [item, name, cost];				
				obj[datetime].push(arr);
			}
						
			// json 파일 저장			
			var jsonStr = JSON.stringify(obj, null, 2);									
			
			var blob = new Blob([jsonStr], { type: 'application/json' });
			var url = URL.createObjectURL(blob);
			var a = document.createElement('a');
			a.href = url;
			a.download = "text.json";
			a.click();
			
			URL.revokeObjectURL(url);
		}
		
		function fn_day() { //오늘 날짜
			var today = new Date();
			var year = today.getFullYear();
			var month = ('0'+(today.getMonth() + 1)).slice(-2);
			var day = ('0'+today.getDate()).slice(-2);
			var dateStr = year + month + day;
			return dateStr
		}				
	</script>
</head>

<body>
<!-- S. file -->
	<div id='file'>
		<div>
			<h4>파일 선택</h4>
			<div id="read">
				<input type="file" id="fileInput" accept=".json">
			</div>
		</div>
	</div>
<!-- E. file -->

<!-- S. list -->
	<div id='list'>
		<div style='display:ruby;'>
			<h4>목록</h4>		
			<button onclick='fn_detail()'>추가</button>
		</div>
	</div>
<!-- E. list -->

<!-- S. detail -->
	<div id='detail'>
		<div>
			<h4>날짜</h4>
			<div><input type='text' name='datetime' id='datetime'></div>
		</div>
		
		<div style="display:flex">
			<div>
				<h4>항목</h4>
				<button onclick='fn_add()'>추가</button>
				<div id='area_cost'></div>
			</div>
		</div>
		
		<div>
			<h4>합계</h4>
			<div id='area_sum'></div>	
		</div>
		
		<div>
			<button onclick="fn_save();">저장</button>
			<button onclick="fn_list();">뒤로</button>
		</div>		
	</div>
<!-- E. detail -->	
</body>
</html>
